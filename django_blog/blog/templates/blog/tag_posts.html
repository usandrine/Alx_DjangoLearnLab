{% extends 'blog/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<h1>{{ title }}</h1>

{% if posts %}
    <div class="post-list">
        {% for post in posts %}
        <div class="post-card">
            <h2><a href="{% url 'post_detail' post.pk %}">{{ post.title }}</a></h2>
            <!-- Same content as search_results.html -->
        </div>
        {% endfor %}
    </div>
{% else %}
    <p>No posts found with this tag.</p>
{% endif %}
{% endblock %}
