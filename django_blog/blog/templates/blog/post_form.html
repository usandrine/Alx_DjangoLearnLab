{% extends 'blog/base.html' %}

{% block title %}{% if form.instance.pk %}Edit Post{% else %}New Post{% endif %}{% endblock %}

{% block content %}
<h1>{% if form.instance.pk %}Edit Post{% else %}Create New Post{% endif %}</h1>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Save</button>
    <a href="{% url 'post_list' %}" class="btn">Cancel</a>
</form>
{% endblock %}
