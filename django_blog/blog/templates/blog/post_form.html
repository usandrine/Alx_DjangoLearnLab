{% extends 'blog/base.html' %}

{% block content %}
<h2>{% if object %}Edit Post{% else %}New Post{% endif %}</h2>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Save</button>
    <a href="{% url 'post_list' %}" class="btn">Cancel</a>
</form>
{% endblock %}
